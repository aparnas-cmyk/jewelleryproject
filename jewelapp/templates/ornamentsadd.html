<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1> ORNAMENTS DETAILS</h1>
<div class="row">
                                            <div class="col-sm-12">
                                                <!-- Basic Form Inputs card start -->
                                                <div class="card">
                                                    <div class="card-header">
                                                        <h5>Basic Form Inputs</h5>
                                                        <span>Add class of <code>.form-control</code> with <code>&lt;input&gt;</code> tag</span>
                                                    </div>
                                                    <div class="card-block">
                                                        <h4 class="sub-title">Basic Inputs</h4>
                                                        <form method="POST" action="{% url 'saveornaments' %}" enctype="multipart/form-data">
                                                            {% csrf_token %}
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Category Name</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" name="Category_Name">
                                                                </div>
                                                            </div>
                                                             <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Product Name</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" name="Product_Name">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Price</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Number" class="form-control" name="Price">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Description</label>
                                                                <div class="col-sm-10">
                                                                    <textarea rows="5" cols="5" class="form-control" placeholder="Default textarea" name="Description"></textarea>
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">weight</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="weight">
                                                                </div>
                                                            </div>
                                                             <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">item_gross_weight</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="item_gross_weight">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">item_net_weight</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="item_net_weight">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label"> chain_length </label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="chain_length">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Ornaments_img</label>
                                                                <div class="col-sm-10">
                                                                    <input type="file" class="form-control" name="Ornaments_img">
                                                                </div>
                                                            </div>

                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Ornaments_img2</label>
                                                                <div class="col-sm-10">
                                                                    <input type="file" class="form-control" name="Ornaments_img2">
                                                                </div>
                                                            </div>
                                                             <button class="btn btn-danger waves-effect waves-light" type="submit">Submit</button>
                                                        </form>

                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- Basic Form Inputs card end -->
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Page body end -->
                                </div>
                            </div>
</body>
</html>
   {% endblock %}
