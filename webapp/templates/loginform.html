<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Stylish Form</title>

<!-- Google Font -->

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#6a11cb,#2575fc,#ff6ec4,#7873f5);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
    overflow:hidden;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    position:relative;
    width:380px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.container h2{
    color:#fff;
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.inputBox{
    position:relative;
    margin-bottom:28px;
}

.inputBox input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:16px;
    transition:.3s;
}

.inputBox input:focus{
    background:rgba(255,255,255,.25);
    box-shadow:0 0 15px #00e5ff;
}

.inputBox label{
    position:absolute;
    left:15px;
    top:15px;
    color:#ddd;
    pointer-events:none;
    transition:.3s;
}

.inputBox input:focus~label,
.inputBox input:valid~label{
    top:-10px;
    left:10px;
    font-size:12px;
    color:#00f7ff;
    background:#222;
    padding:2px 8px;
    border-radius:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    font-size:18px;
    font-weight:600;
    color:white;
    cursor:pointer;
    background:linear-gradient(45deg,#00dbde,#fc00ff);
    transition:.4s;
    box-shadow:0 0 20px rgba(255,255,255,.25);
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 0 25px cyan;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#eee;
}

.footer a{
    color:#00f7ff;
    text-decoration:none;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:120px;
    height:120px;
    top:-50px;
    left:-50px;
}

.circle:nth-child(2){
    width:150px;
    height:150px;
    bottom:-60px;
    right:-60px;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-20px);
    }
}

::placeholder{
    color:transparent;
}
</style>
</head>

<body>

<div class="container">

<div class="circle"></div>
<div class="circle"></div>

<h2>Welcome</h2>

<form method="POST" action="{% url 'userlogin' %} " enctype="multipart/form-data">
{% csrf_token %}
<div class="inputBox">
<input type="text" placeholder="Full_Name" name="username" required>
<label>Full Name</label>
</div>

<div class="inputBox">
<input type="password" placeholder="password" name="password" required>
<label>Password</label>
</div>


<!--<div class="inputBox">-->
<!--<input type="password" placeholder="confirm_password" name="confirm_password" required>-->
<!--<label>Confirm_Password</label>-->
<!--</div>-->

<!--<div class="inputBox">-->
<!--<input type="text" placeholder="Email" name="Email" required>-->
<!--<label>Email Address</label>-->
<!--</div>-->

<!--<div class="inputBox">-->
<!--<input type="number" placeholder="number" name="number" required>-->
<!--<label>Number</label>-->
<!--</div>-->

<button type="submit">Login</button>

<div class="footer">
<p>Don't have an account?
<a href="{% url 'userregister' %}">Register</a></p>
</div>

</form>


</div>

</body>
</html>
